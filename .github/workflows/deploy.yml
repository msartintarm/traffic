name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
      # Nightly + rust-src for the atomics/`build-std` threaded wasm build below.
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            engine/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('engine/Cargo.lock') }}

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web

      # Threaded wasm build (nightly + build-std) into public/wasm-pkg-threads/, so the
      # deployed site can serve the CPU-threads module to cross-origin-isolated browsers.
      # Additive: the single-threaded package is still built by `npm run build`'s
      # prebuild below, and browsers without isolation fall back to it.
      - name: Build the threaded wasm package
        run: npm run wasm:build:threads
        working-directory: web
        # Required: a threaded-build failure fails the whole deploy, so a broken build
        # never ships a degraded, silently single-threaded site — the last good deploy
        # stays live until it's fixed. (The frontend still falls back at *runtime* for
        # browsers that can't cross-origin isolate; that's a capability limit, not a
        # broken build.)

      # The Millbrae map (public OSM data, projected to local metres) is
      # committed at web/public/map.json; `npm run build` runs `prebuild` to
      # rebuild the (single-threaded) wasm package, then the Next export copies
      # public/ (both wasm packages + the map) to the site. GitHub Pages gzips
      # map.json on the wire (~16 KB).
      # Every real map must ship its commute-OD sibling (tools/lodes/fetch_lodes.py
      # --map). A missing file would silently degrade that map's demand to
      # sampled-only, so it fails the deploy — the last good deploy stays live.
      # Maps and OD files ship as `.gz` (the app fetches gz-first); a plain
      # sibling is optional either way.
      - name: Require commute OD next to every real map
        run: |
          python3 - <<'EOF'
          import gzip, json, os, sys
          pub = "web/public"
          names = sorted(os.listdir(pub))
          missing, seen = [], set()
          for f in names:
              base = f[:-8] if f.endswith(".json.gz") else f[:-5] if f.endswith(".json") else None
              if base is None or base.endswith(".lodes") or base in seen:
                  continue
              seen.add(base)
              opener = gzip.open if f.endswith(".gz") else open
              try:
                  meta = json.load(opener(os.path.join(pub, f), "rt")).get("meta", {})
              except Exception:
                  continue
              if "bbox" not in meta:
                  continue  # not a scraped map
              if not any(f"{base}.lodes{s}" in names for s in (".json", ".json.gz")):
                  missing.append(f"{base}.lodes.json.gz")
          if missing:
              sys.exit("missing commute OD files: " + ", ".join(missing))
          print("commute OD present for every real map")
          EOF

      - name: Build static export
        run: npm run build
        working-directory: web
        env:
          NEXT_PUBLIC_BASE_PATH: /traffic

      - name: Disable Jekyll processing
        run: touch web/out/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
