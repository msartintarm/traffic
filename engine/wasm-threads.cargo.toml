[target.wasm32-unknown-unknown]
rustflags = [
  "-C", "target-feature=+atomics,+bulk-memory,+mutable-globals",
  "-C", "link-arg=--shared-memory",
  "-C", "link-arg=--import-memory",
  # DECLARED import ceiling only — not the reservation. With --import-memory the JS side
  # creates the shared WebAssembly.Memory and picks its `maximum` per-map (see
  # `threadsMemory` in engineSession.ts); this value only bounds how large that memory may
  # be. A shared memory reserves its full `maximum` up front, so a single fixed ceiling made
  # small maps pay big-map memory pressure (measurably slower — a 2 GiB fixed ceiling
  # regressed SF). Keep this at the largest map a device is expected to reserve: Columbus
  # (66k nodes / 152k links) needs ~2 GiB at its boot mesh-marshaling peak, while SF and
  # smaller get a smaller per-map memory and stay fast. A device that can't reserve the
  # requested size throws at memory creation and `loadEngine` falls back to the single-
  # threaded build (grows on demand toward the 4 GiB wasm32 limit), which loads it anyway.
  "-C", "link-arg=--max-memory=2147483648",
  "-C", "link-arg=--export=__heap_base",
  "-C", "link-arg=--export=__wasm_init_tls",
  "-C", "link-arg=--export=__tls_base",
  "-C", "link-arg=--export=__tls_size",
  "-C", "link-arg=--export=__tls_align",
]
